services:
  nodejs:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile
    image: node-starter-img
    container_name: node-stater-app
    restart: on-failure:3
    env_file:
      - .env.prod
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health'] # alpine has busybox wget, not curl
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
